<style>
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    background-color: [[color.surface]];
  }
  table,
  td {
    border-collapse: collapse;
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
  }
  .page {
    background-color: [[color.surface]];
  }
  .card {
    background-color: [[color.bg]];
    border: 1px solid [[color.border]];
    border-radius: 16px;
    overflow: hidden;
  }
  .hero {
    background-color: [[color.primary]];
  }
  .eyebrow {
    background-color: [[color.tint]];
    color: [[color.eyebrow]];
    border-radius: 999px;
    font-family: [[font.family]];
    font-size: [[font.size.eyebrow]];
    line-height: 16px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hero-title {
    margin: 0;
    font-family: [[font.family]];
    font-size: [[font.size.h1]];
    line-height: 1.2;
    font-weight: bold;
    color: [[color.onPrimary]];
  }
  .hero-intro {
    margin: 0;
    font-family: [[font.family]];
    font-size: 18px;
    line-height: 1.6;
    color: [[color.heroMuted]];
  }
  .tile {
    background-color: [[color.tint]];
    border-radius: 12px;
  }
  .text {
    margin: 0;
    font-family: [[font.family]];
    font-size: [[font.size.body]];
    line-height: [[font.lineHeight]];
    color: [[color.text]];
  }
  .h2 {
    margin: 0;
    font-family: [[font.family]];
    font-size: [[font.size.h2]];
    line-height: 1.3;
    font-weight: bold;
    color: [[color.text]];
  }
  .muted {
    font-family: [[font.family]];
    font-size: [[font.size.small]];
    line-height: [[font.lineHeight]];
    color: [[color.muted]];
  }
  .link {
    color: [[color.link]];
    text-decoration: underline;
  }
  .wordmark {
    font-size: 20px;
    font-weight: bold;
  }
  .badge {
    background-color: [[color.primary]];
    color: [[color.onPrimary]];
    border-radius: 16px;
    font-family: [[font.family]];
    font-size: 16px;
    font-weight: bold;
  }
  .date-block {
    background-color: [[color.bg]];
    color: [[color.text]];
    border-radius: 12px;
    font-family: [[font.family]];
  }
  .button-cell {
    background-color: [[color.primary]];
  }
  .button-link {
    display: inline-block;
    padding: 0 36px;
    background-color: [[color.primary]];
    color: [[color.onPrimary]];
    font-family: [[font.family]];
    font-size: 16px;
    font-weight: bold;
    line-height: 52px;
    text-decoration: none;
    border-radius: 999px;
  }

  .announce {
    background-color: [[color.accent]];
    border-radius: 8px;
  }
  .announce-text {
    font-family: [[font.family]];
    font-size: 14px;
    line-height: 20px;
    font-weight: bold;
    color: [[color.onAccent]];
    text-align: center;
  }
  .stat-number {
    font-family: [[font.family]];
    font-size: 32px;
    line-height: 1.1;
    font-weight: bold;
    color: [[color.eyebrow]];
  }
  .score {
    font-family: [[font.family]];
    font-size: 56px;
    line-height: 1;
    font-weight: bold;
    color: [[color.text]];
  }
  .stars {
    font-family: [[font.family]];
    font-size: 20px;
    line-height: 1.2;
    letter-spacing: 2px;
    color: [[color.star]];
  }
  .strike {
    color: [[color.muted]];
    text-decoration: line-through;
  }
  .plan {
    background-color: [[color.bg]];
    border: 1px solid [[color.border]];
    border-radius: 12px;
  }
  .plan-featured {
    background-color: [[color.tint]];
    border: 2px solid [[color.primary]];
    border-radius: 12px;
  }
  .plan-name {
    font-family: [[font.family]];
    font-size: 18px;
    line-height: 1.3;
    font-weight: bold;
    color: [[color.text]];
  }
  .price {
    font-family: [[font.family]];
    font-size: 32px;
    line-height: 1.2;
    font-weight: bold;
    color: [[color.text]];
  }
  .plan-badge {
    background-color: [[color.accent]];
    color: [[color.onAccent]];
    border-radius: 999px;
    font-family: [[font.family]];
    font-size: 12px;
    line-height: 16px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .button-small {
    display: block;
    padding: 0 12px;
    font-size: 15px;
    line-height: 44px;
    text-align: center;
  }
  .promo {
    background-color: [[color.tint]];
    border: 2px dashed [[color.primary]];
    border-radius: 12px;
  }
  .promo-code {
    font-family: "Courier New", Courier, monospace;
    font-size: 32px;
    line-height: 1.2;
    font-weight: bold;
    letter-spacing: 0.12em;
    color: [[color.eyebrow]];
  }
  .kicker {
    font-family: [[font.family]];
    font-size: 12px;
    line-height: 16px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: [[color.eyebrow]];
  }
  .h3 {
    margin: 0;
    font-family: [[font.family]];
    font-size: 18px;
    line-height: 1.35;
    font-weight: bold;
    color: [[color.text]];
  }
  .tip {
    background-color: [[color.tint]];
    border-left: 4px solid [[color.accent]];
    border-radius: 8px;
  }
  .bar-track {
    background-color: [[color.bg]];
    border-radius: 4px;
  }
  .bar-fill {
    background-color: [[color.primary]];
    border-radius: 4px;
  }
  .nav-link {
    font-weight: bold;
  }

  @media (max-width: 480px) {
    .px {
      padding-left: 20px !important;
      padding-right: 20px !important;
    }
    .hero-title {
      font-size: 26px !important;
    }
    .hero-intro {
      font-size: 16px !important;
    }
    .button-link {
      display: block !important;
      text-align: center !important;
    }
    .col {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .score {
      font-size: 48px !important;
    }
    .stat-number {
      font-size: 20px !important;
    }
  }

  @media (prefers-color-scheme: dark) {
    body,
    .page {
      background-color: [[dark.color.bg]] !important;
    }
    .card {
      background-color: [[dark.color.surface]] !important;
      border-color: [[dark.color.border]] !important;
    }
    .hero {
      background-color: [[dark.color.primary]] !important;
    }
    .tile,
    .eyebrow {
      background-color: [[dark.color.tint]] !important;
    }
    .eyebrow {
      color: [[dark.color.eyebrow]] !important;
    }
    .date-block {
      background-color: [[dark.color.bg]] !important;
    }
    .hero-title {
      color: [[dark.color.onPrimary]] !important;
    }
    .hero-intro {
      color: [[dark.color.heroMuted]] !important;
    }
    .text,
    .h2,
    .date-block {
      color: [[dark.color.text]] !important;
    }
    .muted {
      color: [[dark.color.muted]] !important;
    }
    .link {
      color: [[dark.color.link]] !important;
    }
    .badge,
    .button-cell,
    .button-link {
      background-color: [[dark.color.accent]] !important;
    }
    .badge,
    .button-link {
      color: [[dark.color.onAccent]] !important;
    }
    .plan,
    .plan-featured,
    .promo,
    .tip {
      background-color: [[dark.color.tint]] !important;
    }
    .plan {
      border-color: [[dark.color.border]] !important;
    }
    .plan-featured {
      border-color: [[dark.color.accent]] !important;
    }
    .promo {
      border-color: [[dark.color.eyebrow]] !important;
    }
    .bar-track {
      background-color: [[dark.color.bg]] !important;
    }
    .bar-fill {
      background-color: [[dark.color.eyebrow]] !important;
    }
    .stat-number,
    .promo-code,
    .kicker {
      color: [[dark.color.eyebrow]] !important;
    }
    .stars {
      color: [[dark.color.star]] !important;
    }
    .plan-name,
    .price,
    .score,
    .h3 {
      color: [[dark.color.text]] !important;
    }
    .strike {
      color: [[dark.color.muted]] !important;
    }
  }
</style>
