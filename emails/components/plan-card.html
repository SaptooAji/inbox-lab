<td class="col" width="33%" valign="top" style="padding: 6px">
  <table
    role="presentation"
    class="plan"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="border-collapse: separate"
  >
    <tr>
      <td style="padding: 20px 16px">
        <p style="margin: 0 0 8px 0; height: 22px; font-size: 1px; line-height: 22px">&nbsp;</p>
        <p class="plan-name" style="margin: 0">[[name]]</p>
        <p class="muted" style="margin: 12px 0 0 0">Was <s class="strike">[[oldPrice]]</s></p>
        <p class="price" style="margin: 0">[[price]]<span class="muted"> [[period]]</span></p>
        <p class="muted" style="margin: 12px 0 0 0">&#10003; [[f1]]</p>
        <p class="muted" style="margin: 4px 0 0 0">&#10003; [[f2]]</p>
        <p class="muted" style="margin: 4px 0 0 0">&#10003; [[f3]]</p>
        <table
          role="presentation"
          width="100%"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="margin-top: 16px"
        >
          <tr>
            <td class="button-cell" align="center" style="border-radius: 999px">
              <a href="[[href]]" class="button-link button-small">[[cta]]</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</td>
