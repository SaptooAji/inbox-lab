<tr>
  <td class="px" style="padding: 8px 32px 16px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="tile" style="padding: 24px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td
                class="col"
                width="40%"
                align="center"
                valign="middle"
                style="padding: 0 8px 16px 8px"
              >
                <p class="score" style="margin: 0">[[score]]</p>
                <p
                  class="stars"
                  role="img"
                  aria-label="[[score]] out of 5 stars"
                  style="margin: 4px 0 0 0"
                >
                  &#9733;&#9733;&#9733;&#9733;&#9733;
                </p>
                <p class="muted" style="margin: 4px 0 0 0">Based on [[count]] reviews</p>
              </td>
              <td class="col" width="60%" valign="middle" style="padding: 0 8px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="56" class="muted" style="padding: 4px 0">5 stars</td>
                    <td style="padding: 4px 8px">
                      <table
                        role="presentation"
                        class="bar-track"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        <tr>
                          <td
                            class="bar-fill"
                            width="[[p5]]%"
                            height="8"
                            style="height: 8px; font-size: 0; line-height: 0"
                          >
                            &nbsp;
                          </td>
                          <td style="font-size: 0; line-height: 0">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                    <td width="40" align="right" class="muted" style="padding: 4px 0">[[p5]]%</td>
                  </tr>
                  <tr>
                    <td width="56" class="muted" style="padding: 4px 0">4 stars</td>
                    <td style="padding: 4px 8px">
                      <table
                        role="presentation"
                        class="bar-track"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        <tr>
                          <td
                            class="bar-fill"
                            width="[[p4]]%"
                            height="8"
                            style="height: 8px; font-size: 0; line-height: 0"
                          >
                            &nbsp;
                          </td>
                          <td style="font-size: 0; line-height: 0">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                    <td width="40" align="right" class="muted" style="padding: 4px 0">[[p4]]%</td>
                  </tr>
                  <tr>
                    <td width="56" class="muted" style="padding: 4px 0">3 stars</td>
                    <td style="padding: 4px 8px">
                      <table
                        role="presentation"
                        class="bar-track"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        <tr>
                          <td
                            class="bar-fill"
                            width="[[p3]]%"
                            height="8"
                            style="height: 8px; font-size: 0; line-height: 0"
                          >
                            &nbsp;
                          </td>
                          <td style="font-size: 0; line-height: 0">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                    <td width="40" align="right" class="muted" style="padding: 4px 0">[[p3]]%</td>
                  </tr>
                  <tr>
                    <td width="56" class="muted" style="padding: 4px 0">2 stars</td>
                    <td style="padding: 4px 8px">
                      <table
                        role="presentation"
                        class="bar-track"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        <tr>
                          <td
                            class="bar-fill"
                            width="[[p2]]%"
                            height="8"
                            style="height: 8px; font-size: 0; line-height: 0"
                          >
                            &nbsp;
                          </td>
                          <td style="font-size: 0; line-height: 0">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                    <td width="40" align="right" class="muted" style="padding: 4px 0">[[p2]]%</td>
                  </tr>
                  <tr>
                    <td width="56" class="muted" style="padding: 4px 0">1 star</td>
                    <td style="padding: 4px 8px">
                      <table
                        role="presentation"
                        class="bar-track"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        <tr>
                          <td
                            class="bar-fill"
                            width="[[p1]]%"
                            height="8"
                            style="height: 8px; font-size: 0; line-height: 0"
                          >
                            &nbsp;
                          </td>
                          <td style="font-size: 0; line-height: 0">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                    <td width="40" align="right" class="muted" style="padding: 4px 0">[[p1]]%</td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
