<tr>
  <td class="px" style="padding: 6px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="tile" style="padding: 20px">
          <p class="stars" role="img" aria-label="[[rating]] out of 5 stars" style="margin: 0">
            [[stars]]
          </p>
          <p class="text" style="margin: 8px 0 0 0"><strong>[[title]]</strong></p>
          <p class="text" style="margin: 4px 0 0 0">[[body]]</p>
          <p class="muted" style="margin: 12px 0 0 0">[[author]] &middot; [[meta]]</p>
        </td>
      </tr>
    </table>
  </td>
</tr>
