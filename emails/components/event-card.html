<tr>
  <td class="px" style="padding: 6px 32px 16px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="tile" style="padding: 18px 20px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td width="64" valign="top">
                <table
                  role="presentation"
                  width="64"
                  height="64"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      width="64"
                      height="64"
                      align="center"
                      valign="middle"
                      class="date-block"
                      style="width: 64px; height: 64px"
                    >
                      <span style="font-size: 12px; line-height: 16px; font-weight: bold"
                        >[[month]]</span
                      ><br /><span style="font-size: 24px; line-height: 28px; font-weight: bold"
                        >[[day]]</span
                      >
                    </td>
                  </tr>
                </table>
              </td>
              <td valign="top" style="padding-left: 16px">
                <p class="text" style="margin: 0">
                  <a href="[[href]]" class="link"><strong>[[title]]</strong></a
                  ><br /><span class="muted">[[details]]</span>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
