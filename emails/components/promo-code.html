<tr>
  <td class="px" style="padding: 8px 32px 32px 32px">
    <table
      role="presentation"
      class="promo"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="border-collapse: separate"
    >
      <tr>
        <td align="center" style="padding: 24px 16px">
          <p class="muted" style="margin: 0">[[label]]</p>
          <p class="promo-code" style="margin: 8px 0">[[code]]</p>
          <p class="muted" style="margin: 0">[[note]]</p>
        </td>
      </tr>
    </table>
  </td>
</tr>
