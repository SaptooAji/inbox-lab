<tr>
  <td class="px" style="padding: 6px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="tile" style="padding: 20px">
          <p class="kicker" style="margin: 0">[[category]] &middot; [[readTime]]</p>
          <h3 class="h3" style="margin: 8px 0 0 0">
            <a href="[[href]]" class="link">[[title]]</a>
          </h3>
          <p class="text" style="margin: 8px 0 0 0">[[excerpt]]</p>
          <p class="text" style="margin: 12px 0 0 0">
            <a href="[[href]]" class="link"><strong>Read the article &rarr;</strong></a>
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>
